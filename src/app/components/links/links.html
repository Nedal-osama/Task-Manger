<div class="container">
  <h2>Useful Links</h2>

  <div class="links-grid">
    @for (link of links; track link.url) {
      <div class="link-card">
        <h3 class="link-title">{{ link.title }}</h3>
        <a [href]="link.url" target="_blank" rel="noopener noreferrer" class="link-button">
          Visit Link
        </a>
      </div>
    }
  </div>
</div>
