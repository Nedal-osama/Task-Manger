<div class="app-container">
  <!-- Navbar الكامل بعد تسجيل الدخول -->
  @if (!isLoginPage()) {
    <nav class="navbar">
      <div class="navbar-content">
        <div class="navbar-brand">
          <h1 class="navbar-title">{{ title() }}</h1>
        </div>
        <ul class="nav-links">
          <li>
            <a
              routerLink="/"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <span class="nav-icon">📝</span>
              <span class="nav-text">Scripts</span>
            </a>
          </li>
          <li>
            <a routerLink="/tasks" routerLinkActive="active" class="nav-link">
              <span class="nav-icon">✓</span>
              <span class="nav-text">Tasks</span>
            </a>
          </li>
          <li>
            <a routerLink="/links" routerLinkActive="active" class="nav-link">
              <span class="nav-icon">🔗</span>
              <span class="nav-text">Links</span>
            </a>
          </li>
        </ul>
        <button class="logout-btn" (click)="logout()">Logout</button>
      </div>
    </nav>
  }

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
